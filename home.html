<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <!-- tailwind + daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <!-- font awsome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Payoo || Home</title>
    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class=" min-h-screen max-w-md bg-base-200 mx-auto">
    <header class=" border-b-2 border-gray-300 sticky top-0 bg-base-200 z-10 ">
        <section class=" w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-2">
                <div class="logo w-[60px]">
                    <img src="./assets/logo.png" alt="">
                </div>
                <div class="balance-info">
                    <h2 class=" text-2xl font-bold text-black">$ <span id="balance">45000</span></h2>
                    <p class=" text-gray-500">Available Balance</p>
                </div>
            </div>
            <div class="right">
                
            <a href="./index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket rotate-180"></i>Logout</a>
            </div>

        </section>
    </header>

    <section class=" w-11/12 mx-auto py-10 space-y-5 ">
        <h2 class=" font-bold text-2xl text-black">Welcome to Pay<span class="text-primary">oo</span></h2>
        <p class=" text-gray-500">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

        <div class="buttons grid grid-cols-3 gap-3">

            <button onclick="showOnly('addMoney')" class="btn flex-col h-full py-4 rounded-xl btn-primary btn-soft">
                <img src="./assets/opt-1.png" alt="">
                <p>Add money</p>
            </button>
            <button onclick="showOnly('cashout')" class="btn flex-col h-full py-4 rounded-xl btn-primary btn-soft">
                <img src="./assets/opt-2.png" alt="">
                <p>Cashout</p>
            </button>
            <button onclick="showOnly('transferMoney')" class="btn flex-col h-full py-4 rounded-xl btn-primary btn-soft">
                <img src="./assets/opt-3.png" alt="">
                <p>Transfer money</p>
            </button>
            <button onclick="showOnly('getBonus')" class="btn flex-col h-full py-4 rounded-xl btn-primary btn-soft">
                <img src="./assets/opt-4.png" alt="">
                <p>Get bonus</p>
            </button>
            <button onclick="showOnly('payBill')" class="btn flex-col h-full py-4 rounded-xl btn-primary btn-soft">
                <img src="./assets/opt-5.png" alt="">
                <p>Pay bill</p>
            </button>
            <button onclick="showOnly('history')" class="btn flex-col h-full py-4 rounded-xl btn-primary btn-soft">
                <img src="./assets/opt-6.png" alt="">
                <p>Transaction</p>
            </button>
        </div>
    </section>

    <section id="addMoney" class=" w-11/12 mx-auto py-5  hidden">
        <h2 class=" text-xl font-bold text-black">Add Money</h2>
        <div class=" mt-8">
        <div class="card bg-base-100 w-full rounded-2xl">
          <div class="card-body">
            <fieldset class="fieldset">
                <label class="label font-medium text-black text-[1rem]">Select a bank</label>
                <select id="add-money-bank" class="select rounded-2xl w-full bg-base-300">
                     <option disabled selected>Select a bank</option>
                     <option value="Bangladesh Bank">Bangladesh Bank</option>
                     <option value="Sonali Bank">Sonali Bank</option>
                     <option value="Rupali Bank">Rupali Bank</option>
                </select>
              <label class="label font-medium text-black text-[1rem]">Bank Account Number</label>
              <input type="text" id="account-num" maxlength="11" minlength="11" class="input rounded-2xl w-full
               bg-base-300" placeholder="Enter 11 digit number" />
              <label class="label font-medium text-black text-[1rem]">Amount to add</label>
              <input type="number" id="money-amount" maxlength="1" minlength="100" class="input rounded-2xl w-full bg-base-300" placeholder="Enter withdraw amount" />

              <label class="label font-medium text-black text-[1rem]">Pin number</label>
              <input type="password" id="add-money-pin" maxlength="4" minlength="4" class="input w-full rounded-2xl bg-base-300" placeholder="Enter 4 Digit pin" />
              
              <button id="add-money-btn" class="btn btn-primary mt-4 rounded-2xl text-xl font-semibold">Add money</button>
            </fieldset>
          </div>
        </div>
  </div>
    </section>

    <section id="cashout" class=" w-11/12 mx-auto py-5  hidden">
        <h2 class=" text-xl font-bold text-black">Cashout</h2>
        <div class=" mt-8">
        <div class="card bg-base-100 w-full rounded-2xl">
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label font-medium text-black text-[1rem]">Agent Number</label>
              <input type="text" id="cashout-num" maxlength="11" minlength="11" class="input rounded-2xl w-full
               bg-base-300" placeholder="Enter 11 digit number" />
              <label class="label font-medium text-black text-[1rem]">Amount</label>
              <input type="number" id="cashout-amount" maxlength="11" minlength="11" class="input rounded-2xl w-full bg-base-300" placeholder="Enter withdraw amount" />

              <label class="label font-medium text-black text-[1rem]">Pin number</label>
              <input type="password" id="cashout-pin" maxlength="4" minlength="4" class="input w-full rounded-2xl bg-base-300" placeholder="Enter 4 Digit pin" />
              
              <button id="cashout-btn" class="btn btn-primary mt-4 rounded-2xl text-xl font-semibold">Withdraw money</button>
            </fieldset>
          </div>
        </div>
  </div>
   </section>



    <section id="transferMoney" class=" w-11/12 mx-auto py-5 hidden">
        <h2 class=" text-xl font-bold text-black">Transfer Money</h2>
     <div class=" mt-8 mx-5">
        <div class="card bg-base-100 w-full rounded-2xl">
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label font-medium text-black text-[1rem]">User account Number</label>
              <input type="text" id="user-num" maxlength="11" minlength="11" class="input rounded-2xl w-full
               bg-base-300" placeholder="Enter 11 digit number" />
              <label class="label font-medium text-black text-[1rem]">Amount</label>
              <input type="number" id="transfer-amount" maxlength="11" minlength="11" class="input rounded-2xl w-full bg-base-300" placeholder="Enter transfer amount" />

              <label class="label font-medium text-black text-[1rem]">Pin number</label>
              <input type="password" id="transfer-pin" maxlength="4" minlength="4" class="input w-full rounded-2xl bg-base-300" placeholder="Enter 4 Digit pin" />
              
              <button id="transfer-btn" class="btn btn-primary mt-4 rounded-2xl text-xl font-semibold">Send Now</button>
            </fieldset>
          </div>
        </div>
  </div>
</section>


<section id="getBonus" class=" w-11/12 mx-auto py-5 hidden">
        <h2 class=" text-xl font-bold text-black">Get Bonus</h2>
     <div class=" mt-8 mx-5">
        <div class="card bg-base-100 w-full rounded-2xl">
          <div class="card-body">
            <fieldset class="fieldset">

              <label class="label font-medium text-black text-[1rem]">Enter Bonus Coupon</label>
              <input type="text" id="bonus-coupon" maxlength="6" minlength="4" class="input w-full rounded-2xl bg-base-300" placeholder="Enter your coupon" />
              
              <button id="bonus-btn" class="btn btn-primary mt-4 rounded-2xl text-xl font-semibold">Get Bonus</button>
            </fieldset>
          </div>
        </div>
  </div>
</section>

<section id="payBill" class=" w-11/12 mx-auto py-5  hidden">
        <h2 class=" text-xl font-bold text-black">Pay Bill</h2>
        <div class=" mt-8">
        <div class="card bg-base-100 w-full rounded-2xl">
          <div class="card-body">
            <fieldset class="fieldset">
                <label class="label font-medium text-black text-[1rem]">Select To Pay</label>
                <select id="pay-money-bill" class="select rounded-2xl w-full bg-base-300">
                     <option disabled selected>Select a bill</option>
                     <option value="Internet Bill">Internet Bill</option>
                     <option value="Electricity Bill">Electricity Bill</option>
                     <option value="Gas Bill">Gas Bill</option>
                </select>
              <label class="label font-medium text-black text-[1rem]">Biller Account Number</label>
              <input type="text" id="biller-num" maxlength="11" minlength="11" class="input rounded-2xl w-full
               bg-base-300" placeholder="Enter 11 digit number" />
              <label class="label font-medium text-black text-[1rem]">Amount to pay</label>
              <input type="number" id="bill-amount" maxlength="1" minlength="100" class="input rounded-2xl w-full bg-base-300" placeholder="Add amount to pay" />

              <label class="label font-medium text-black text-[1rem]">Pin number</label>
              <input type="password" id="pay-bill-pin" maxlength="4" minlength="4" class="input w-full rounded-2xl bg-base-300" placeholder="Enter 4 Digit pin" />
              
              <button id="pay-bill-btn" class="btn btn-primary mt-4 rounded-2xl text-xl font-semibold">Pay Now</button>
            </fieldset>
          </div>
        </div>
  </div>
    </section>



<section id="history" class=" w-11/12 mx-auto py-5  hidden">
        <h2 class=" text-xl font-bold text-black">Transaction History</h2>
        <div class=" space-y-5" id="history-container">

        </div>
</section>


<script src="./script/machine.js"></script>
<script src="./script/addmoney.js"></script>
<script src="./script/cashout.js"></script>
<script src="./script/transferMoney.js"></script>
<script src="./script/getbonus.js"></script>
<script src="./script/paybill.js"></script>

</body>
</html>
