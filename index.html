<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <!-- tailwind + daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <!-- font awsome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Payoo || Login</title>
    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class=" min-h-screen max-w-md bg-base-200 mx-auto">
    <div class=" w-[200px] mx-auto pt-50">
        <img src="./assets/Logo-full.png" alt="">
    </div>
    <div class=" mt-8">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl">
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label font-medium text-black text-[1rem]">Mobile Number</label>
              <input type="text" id="input-num" maxlength="11" minlength="11" class="input rounded-2xl bg-base-300" placeholder="Enter your number" />
              <label class="label font-medium text-black text-[1rem]">4 Digit Pin</label>
              <input type="password" id="input-pin" maxlength="4" minlength="4" class="input rounded-2xl bg-base-300" placeholder="Enter 4 Digit pin" />
              
              <button id="login-btn" class="btn btn-primary mt-4 rounded-2xl text-xl font-semibold">Login</button>
            </fieldset>
          </div>
        </div>
  </div>

<script src="./script/login.js"></script>
</body>
</html>
